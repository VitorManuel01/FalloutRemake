[plugin]

name="Temple Kit Import"
description="Applies glTF COLOR_0 (baked tint + cavity AO) as albedo on the Temple of Trials kit materials. Works around the Godot 4.7.x glTF importer only flagging vertex-colour albedo on the 2nd+ primitive of a mesh (godotengine/godot#120625, fixed in 4.8)."
author="FalloutAssetPipeline"
version="1.0"
script="plugin.gd"
